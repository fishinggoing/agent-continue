server {
    listen 443 ssl;
    server_name AGENT_IP;
    ssl_certificate /etc/letsencrypt/live/agent-continue-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-continue-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 17m;
    include /etc/nginx/agent-continue-demo-location.conf;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
}
