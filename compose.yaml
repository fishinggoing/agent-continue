services:
  agent-continue:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AGENT_CONTINUE_TOKEN: ${AGENT_CONTINUE_TOKEN:?Set a private token of at least 24 characters}
      TZ: ${TZ:-Asia/Shanghai}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
